services:
  web-platform:
    command:
      - php
      - -d
      - upload_max_filesize=520M
      - -d
      - post_max_size=600M
      - -d
      - max_file_uploads=220
      - -d
      - max_input_vars=6000
      - -d
      - max_execution_time=900
      - -d
      - max_input_time=900
      - -d
      - memory_limit=512M
      - -S
      - 0.0.0.0:8080
      - -t
      - public
      - public/router.php
