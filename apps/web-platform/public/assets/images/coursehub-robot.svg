<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">CourseHub mascot</title>
  <desc id="desc">A friendly black learning robot with a white eye panel and coral antenna.</desc>
  <style>
    .bot{transform-origin:40px 43px;animation:float 3.4s ease-in-out infinite}
    .antenna{transform-origin:49px 20px;animation:tilt 2.8s ease-in-out infinite}
    .eye{transform-origin:center;animation:blink 5.2s infinite}
    @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.5px) rotate(.7deg)}}
    @keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
    @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
    @media (prefers-reduced-motion:reduce){.bot,.antenna,.eye{animation:none}}
  </style>
  <g class="bot">
    <g class="antenna">
      <path d="M48 24c2-9 7-14 15-16" fill="none" stroke="#171611" stroke-width="4" stroke-linecap="round"/>
      <circle cx="65" cy="8" r="6" fill="#ff7043" stroke="#171611" stroke-width="3"/>
    </g>
    <path d="M10 43c0-18 12-28 30-28s30 10 30 28-12 27-30 27S10 61 10 43Z" fill="#171611"/>
    <path d="M19 42c0-10 7-16 21-16s21 6 21 16-7 16-21 16-21-6-21-16Z" fill="#fffaf3"/>
    <ellipse class="eye" cx="32" cy="42" rx="5" ry="8" fill="#171611"/>
    <ellipse class="eye" cx="49" cy="42" rx="5" ry="8" fill="#171611"/>
    <path d="M28 66c4 4 8 6 12 6s9-2 13-6" fill="none" stroke="#ff7043" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
