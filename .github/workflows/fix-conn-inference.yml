name: Fix mysqli connection inference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-conn-inference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add explicit typed connection declarations
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('app/views/instructor/create_course.php'),
              Path('app/views/instructor/edit_course.php'),
          ]

          marker = "InstructorMiddleware::handle();\n"
          declaration = "\n/** @var mysqli $conn */\n$conn = database_connection();\n"

          for path in targets:
              text = path.read_text(encoding='utf-8')

              if '$conn = database_connection();' in text:
                  print(f'{path}: already explicit')
                  continue

              if marker not in text:
                  raise SystemExit(f'{path}: middleware marker not found')

              text = text.replace(marker, marker + declaration, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
              print(f'{path}: patched')

      - name: Verify PHP syntax
        run: |
          php -l app/views/instructor/create_course.php
          php -l app/views/instructor/edit_course.php

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "CourseHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-conn-inference.yml
          git add app/views/instructor/create_course.php app/views/instructor/edit_course.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix mysqli connection inference in instructor course views"
          git push origin HEAD:main
