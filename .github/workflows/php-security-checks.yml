name: PHP Security Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-security:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, fileinfo, mbstring
          coverage: none

      - name: Show PHP version
        run: php --version

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app public tests tools -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l

      - name: Run security helper tests
        run: php tests/security_smoke.php

      - name: Run static security audit
        run: php tools/security_audit.php
