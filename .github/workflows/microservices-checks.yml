name: Microservices checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'architecture.manifest.json'
      - 'docker-compose.microservices.yml'
      - '.github/workflows/microservices-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mysqli, pdo_mysql
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          find apps services packages -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate architecture manifest
        run: php -r '$data=json_decode(file_get_contents("architecture.manifest.json"), true, 512, JSON_THROW_ON_ERROR); if (($data["branch_strategy"] ?? null) !== "main-only") { throw new RuntimeException("Unexpected branch strategy"); } echo "Architecture manifest valid\n";'

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.microservices.yml config --quiet
