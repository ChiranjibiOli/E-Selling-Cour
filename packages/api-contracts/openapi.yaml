openapi: 3.1.0
info:
  title: CourseHub API
  version: 1.0.0
  description: Shared contract for the CourseHub web and mobile clients.
servers:
  - url: http://localhost:9000
paths:
  /health:
    get:
      summary: Check API gateway health
      responses:
        '200':
          description: Gateway is available
  /api/v1/auth/login:
    post:
      summary: Authenticate through the student, instructor, or admin portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portal, email, password]
              properties:
                portal:
                  type: string
                  enum: [student, instructor, admin]
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200': {description: Login successful}
        '401': {description: Invalid credentials or portal}
        '422': {description: Validation failed}
        '429': {description: Login rate limit reached}
  /api/v1/auth/session:
    get:
      summary: Verify a bearer session
      responses:
        '200': {description: Session is valid}
        '401': {description: Session is invalid or expired}
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200': {description: Session revoked}
  /api/v1/courses:
    get:
      summary: List published courses
      responses:
        '501': {description: Feature room exists but domain logic is pending}
  /api/v1/orders:
    post:
      summary: Create an order
      responses:
        '501': {description: Feature room exists but domain logic is pending}
  /api/v1/payments:
    post:
      summary: Start a payment workflow
      responses:
        '501': {description: Feature room exists but domain logic is pending}
