x-php-service: &php-service
  build:
    context: .
    dockerfile: infrastructure/docker/php-runtime.Dockerfile
  volumes:
    - ./:/repo
  networks:
    - coursehub
  restart: unless-stopped

services:
  api-gateway:
    <<: *php-service
    working_dir: /repo/services/api-gateway
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${GATEWAY_PORT:-9000}:8080"
    environment:
      SERVICE_NAME: api-gateway
      IDENTITY_SERVICE_URL: http://identity-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      LEARNING_SERVICE_URL: http://learning-service:8080
      COMMERCE_SERVICE_URL: http://commerce-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080

  public-web:
    <<: *php-service
    working_dir: /repo/apps/public-web
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${PUBLIC_WEB_PORT:-9001}:8080"
    environment:
      PORTAL_NAME: public
      API_BASE_URL: http://localhost:${GATEWAY_PORT:-9000}

  student-web:
    <<: *php-service
    working_dir: /repo/apps/student-web
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${STUDENT_WEB_PORT:-9002}:8080"
    environment:
      PORTAL_NAME: student
      API_BASE_URL: http://localhost:${GATEWAY_PORT:-9000}

  instructor-web:
    <<: *php-service
    working_dir: /repo/apps/instructor-web
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${INSTRUCTOR_WEB_PORT:-9003}:8080"
    environment:
      PORTAL_NAME: instructor
      API_BASE_URL: http://localhost:${GATEWAY_PORT:-9000}

  admin-web:
    <<: *php-service
    working_dir: /repo/apps/admin-web
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${ADMIN_WEB_PORT:-9004}:8080"
    environment:
      PORTAL_NAME: admin
      API_BASE_URL: http://localhost:${GATEWAY_PORT:-9000}

  identity-service:
    <<: *php-service
    working_dir: /repo/services/identity-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    ports:
      - "${IDENTITY_SERVICE_PORT:-9101}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVICE_NAME: identity-service
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3307}
      DB_DATABASE: ${DB_DATABASE:-coursehub}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      IDENTITY_SESSION_TTL: ${IDENTITY_SESSION_TTL:-28800}

  catalog-service:
    <<: *php-service
    working_dir: /repo/services/catalog-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  learning-service:
    <<: *php-service
    working_dir: /repo/services/learning-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  commerce-service:
    <<: *php-service
    working_dir: /repo/services/commerce-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  payment-service:
    <<: *php-service
    working_dir: /repo/services/payment-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  enrollment-service:
    <<: *php-service
    working_dir: /repo/services/enrollment-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  media-service:
    <<: *php-service
    working_dir: /repo/services/media-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  notification-service:
    <<: *php-service
    working_dir: /repo/services/notification-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  review-service:
    <<: *php-service
    working_dir: /repo/services/review-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

  reporting-service:
    <<: *php-service
    working_dir: /repo/services/reporting-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]

networks:
  coursehub:
    driver: bridge
