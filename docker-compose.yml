services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: CourseHub
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Kathmandu

      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: coursehub
      DB_USERNAME: coursehub_user
      DB_PASSWORD: local_coursehub_password

    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coursehub
      MYSQL_USER: coursehub_user
      MYSQL_PASSWORD: local_coursehub_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - coursehub_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  coursehub_db: