x-domain-service: &domain-service
  build:
    context: .
    dockerfile: infrastructure/docker/php-runtime.Dockerfile
  volumes:
    - ./:/repo
  environment: &database-environment
    DB_HOST: db
    DB_PORT: 3307
    DB_DATABASE: coursehub
    DB_USERNAME: coursehub_user
    DB_PASSWORD: local_coursehub_password
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/php-runtime.Dockerfile
    working_dir: /repo
    command: ["php", "tools/run_migrations.php"]
    volumes:
      - ./:/repo
    environment:
      <<: *database-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web-platform:
    build:
      context: .
      dockerfile: infrastructure/docker/php-runtime.Dockerfile
    working_dir: /repo/apps/web-platform
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]
    volumes:
      - ./:/repo
    ports:
      - "9001:8080"
    environment:
      API_BASE_URL: http://api-gateway:8080
      ADMIN_LOGIN_PATH: ${ADMIN_LOGIN_PATH:-/control-room/entry-9d4f}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      COURSEHUB_STORAGE_PATH: /repo/storage
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/php-runtime.Dockerfile
    working_dir: /repo/services/api-gateway
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    volumes:
      - ./:/repo
    ports:
      - "9000:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      LEARNING_SERVICE_URL: http://learning-service:8080
      COMMERCE_SERVICE_URL: http://commerce-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REVIEW_SERVICE_URL: http://review-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080

  identity-service:
    <<: *domain-service
    working_dir: /repo/services/identity-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]
    environment:
      <<: *database-environment
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:-replace-with-a-long-random-admin-entry-code}
      IDENTITY_SESSION_TTL: ${IDENTITY_SESSION_TTL:-28800}
      APP_ENV: ${APP_ENV:-local}
      ALLOW_LOCAL_RESET_TOKEN: ${ALLOW_LOCAL_RESET_TOKEN:-false}
      ALLOW_LOCAL_EMAIL_CODE: ${ALLOW_LOCAL_EMAIL_CODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CourseHub}

  catalog-service:
    <<: *domain-service
    working_dir: /repo/services/catalog-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]

  learning-service:
    <<: *domain-service
    working_dir: /repo/services/learning-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]

  commerce-service:
    <<: *domain-service
    working_dir: /repo/services/commerce-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]

  payment-service:
    <<: *domain-service
    working_dir: /repo/services/payment-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]
    environment:
      <<: *database-environment
      APP_URL: "${APP_URL:-http://localhost:9001}"
      ESEWA_ENV: "${ESEWA_ENV:-sandbox}"
      ESEWA_PRODUCT_CODE: "${ESEWA_PRODUCT_CODE:-EPAYTEST}"
      ESEWA_SECRET_KEY: "${ESEWA_SECRET_KEY:-}"
      ESEWA_PAYMENT_URL: "${ESEWA_PAYMENT_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}"
      ESEWA_STATUS_URL: "${ESEWA_STATUS_URL:-https://rc.esewa.com.np/api/epay/transaction/status/}"
      KHALTI_ENV: "${KHALTI_ENV:-sandbox}"
      KHALTI_SECRET_KEY: "${KHALTI_SECRET_KEY:-}"
      KHALTI_API_URL: "${KHALTI_API_URL:-https://dev.khalti.com/api/v2}"
      KHALTI_WEBSITE_URL: "${KHALTI_WEBSITE_URL:-http://localhost:9001}"

  enrollment-service:
    <<: *domain-service
    working_dir: /repo/services/enrollment-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]

  media-service:
    <<: *domain-service
    working_dir: /repo/services/media-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]

  notification-service:
    <<: *domain-service
    working_dir: /repo/services/notification-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    environment:
      <<: *database-environment
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CourseHub}

  review-service:
    <<: *domain-service
    working_dir: /repo/services/review-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]

  reporting-service:
    <<: *domain-service
    working_dir: /repo/services/reporting-service
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]

  db:
    image: mysql:8.4
    command: ["--port=3307"]
    environment:
      MYSQL_DATABASE: coursehub
      MYSQL_USER: coursehub_user
      MYSQL_PASSWORD: local_coursehub_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3307"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P3307 -uroot -plocal_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - coursehub_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./services/identity-service/database/migrations/001_identity_sessions.sql:/docker-entrypoint-initdb.d/03-identity.sql:ro
      - ./database/migrations/002_learning_progress.sql:/docker-entrypoint-initdb.d/04-learning-progress.sql:ro
      - ./database/migrations/003_instructor_application_and_password_reset.sql:/docker-entrypoint-initdb.d/05-instructor-reset.sql:ro

volumes:
  coursehub_db:
